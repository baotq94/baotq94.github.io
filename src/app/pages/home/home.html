<section class="intro">
  <h1>Hi, I'm Bao.</h1>
  <p>I write about software, daily life and the books I'm reading.</p>
</section>

<section aria-labelledby="latest-heading">
  <div class="section-head">
    <h2 id="latest-heading">Latest posts</h2>
    <a routerLink="/blog">All posts</a>
  </div>
  @for (post of latest(); track post.slug) {
    <app-card
      [title]="post.title"
      [meta]="(post.date | date: 'mediumDate') + ' · ' + post.category"
      [excerpt]="post.excerpt"
      [link]="['/blog', post.slug]"
      [lang]="post.lang"
    />
  } @empty {
    <p class="empty">No posts yet.</p>
  }
</section>
