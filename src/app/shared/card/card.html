<article class="card" [attr.lang]="lang()">
  @if (meta(); as meta) {
    <p class="meta">{{ meta }}</p>
  }
  <h3 class="title">
    @if (link(); as link) {
      <a [routerLink]="link">{{ title() }}</a>
    } @else {
      {{ title() }}
    }
  </h3>
  @if (excerpt(); as excerpt) {
    <p class="excerpt">{{ excerpt }}</p>
  }
</article>
